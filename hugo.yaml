baseURL: https://gustavohrx.github.io/
locale: pt-br
title: Baú de ideias

enableGitInfo: true
enableRobotsTXT: true

module:
  imports:
    - path: github.com/imfing/hextra

menu:
  main:
    - name: Sobre
      pageRef: /sobre
      weight: 1
    - name: Buscar
      weight: 2
      params:
        type: search

params:
  description: Blog pessoal de Gustavo HRX sobre tecnologia, estudos e projetos.
  displayUpdatedDate: true
  dateFormat: 02/01/2006
  theme:
    default: system
    displayToggle: true
  navbar:
    displayTitle: true
    displayLogo: false
  page:
    width: normal
  blog:
    list:
      displayTags: true
    article:
      displayPagination: true
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
  editURL:
    enable: true
    base: https://github.com/GustavoHRX/gustavohrx.github.io/edit/main/content
  footer:
    displayCopyright: true
    displayPoweredBy: false
  footerLinks:
    - name: GitHub
      url: https://github.com/GustavoHRX
    - name: RSS
      url: /index.xml
